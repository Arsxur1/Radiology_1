name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (включая интеграционные и приёмочные)
        run: pytest -q

  # Миграции на настоящей PostgreSQL: подъём с нуля, полный откат, повторный подъём,
  # затем демо-данные и сводная панель (портируемость запросов вне SQLite).
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: medviz
          POSTGRES_PASSWORD: medviz
          POSTGRES_DB: medviz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medviz" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: medviz
      POSTGRES_PASSWORD: medviz
      POSTGRES_DB: medviz
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: upgrade → downgrade → upgrade
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Демо-данные и сводная панель на PostgreSQL
        run: |
          python scripts/seed_demo.py
          python -c "from app.db.session import SessionLocal; from app.services.pilot_dashboard import build_dashboard; d = build_dashboard(SessionLocal()); assert d['totals']['studies'] == 3, d['totals']; print(d['totals'])"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build (строгий tsc + vite)
        run: npm run build

  # Сборка образов развёртывания (как на сервере клиники): backend и шлюз web.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Образ backend
        run: docker build -t medviz-backend ./backend
      - name: Образ web (интерфейс врача + nginx-шлюз)
        run: docker build -t medviz-web ./frontend
      - name: Шлюз стартует с шаблоном и подстановкой пароля Orthanc
        run: |
          docker run -d --name web -e ORTHANC_USERNAME=u -e ORTHANC_PASSWORD=p \
            --add-host backend:127.0.0.1 --add-host orthanc-clean:127.0.0.1 \
            -v "$PWD/infra/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            -v "$PWD/infra/nginx/15-orthanc-auth.envsh:/docker-entrypoint.d/15-orthanc-auth.envsh:ro" \
            -p 8080:80 medviz-web
          sleep 3
          docker exec web grep -q "Basic dTpw" /etc/nginx/conf.d/default.conf
          curl -sf http://localhost:8080/ | grep -q '<div id="root">'
          curl -sf http://localhost:8080/studies/x | grep -q '<div id="root">'
      - name: Сервисы backend импортируются в образе
        run: docker run --rm -e PYTHONPATH=/app medviz-backend python -c "import app.main, app.workers.orthanc_watcher, app.workers.classification_tasks; print('ok')"
