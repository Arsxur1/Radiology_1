name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (включая интеграционные и приёмочные)
        run: pytest -q

  # Миграции на настоящей PostgreSQL: подъём с нуля, полный откат, повторный подъём,
  # затем демо-данные и сводная панель (портируемость запросов вне SQLite).
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: medviz
          POSTGRES_PASSWORD: medviz
          POSTGRES_DB: medviz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medviz" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: medviz
      POSTGRES_PASSWORD: medviz
      POSTGRES_DB: medviz
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: upgrade → downgrade → upgrade
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Демо-данные и сводная панель на PostgreSQL
        run: |
          python scripts/seed_demo.py
          python -c "from app.db.session import SessionLocal; from app.services.pilot_dashboard import build_dashboard; d = build_dashboard(SessionLocal()); assert d['totals']['studies'] == 3, d['totals']; print(d['totals'])"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build (строгий tsc + vite)
        run: npm run build

  # Известные уязвимости зависимостей (PyPI/OSV и npm). Отдельная задача: новая CVE
  # видна сразу и по имени, не смешиваясь с падением тестов.
  deps-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python (backend, включая dev)
        working-directory: backend
        run: |
          python -m venv /tmp/deps && /tmp/deps/bin/pip install -q --upgrade pip
          /tmp/deps/bin/pip install -q ".[dev]"
          /tmp/deps/bin/pip freeze --exclude-editable | grep -v -i '^medviz' > /tmp/req.txt
          pipx run pip-audit -r /tmp/req.txt --no-deps --strict
      - name: npm (frontend)
        working-directory: frontend
        run: npm audit --audit-level=moderate

  # Сборка образов развёртывания (как на сервере клиники): backend и шлюз web.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Образ backend
        run: docker build -t medviz-backend ./backend
      - name: Образ web (интерфейс врача + nginx-шлюз)
        run: docker build -t medviz-web ./frontend
      - name: Шлюз без сертификата — HTTP (с предупреждением), пароль Orthanc подставлен
        run: |
          GW="docker run -d -e ORTHANC_USERNAME=u -e ORTHANC_PASSWORD=p
            --add-host backend:127.0.0.1 --add-host orthanc-clean:127.0.0.1
            --add-host keycloak:127.0.0.1 --add-host ohif:127.0.0.1
            -v $PWD/infra/nginx/locations.conf.template:/etc/nginx/medviz/locations.conf.template:ro
            -v $PWD/infra/nginx/15-orthanc-auth.envsh:/docker-entrypoint.d/15-orthanc-auth.envsh:ro
            -v $PWD/infra/nginx/16-medviz-conf.sh:/docker-entrypoint.d/16-medviz-conf.sh:ro
            -v $PWD/infra/tls:/etc/nginx/tls:ro"
          echo "GW=$GW" | tr -d '\n' >> "$GITHUB_ENV"; echo >> "$GITHUB_ENV"
          $GW --name web -p 8080:80 medviz-web
          sleep 3
          docker logs web 2>&1 | grep -q "шлюз по HTTP"
          docker exec web grep -q "Basic dTpw" /etc/nginx/medviz-locations.conf
          curl -sf http://localhost:8080/ | grep -q '<div id="root">'
          curl -sf http://localhost:8080/studies/x | grep -q '<div id="root">'
          docker rm -f web
      - name: Шлюз с сертификатом — HTTPS, HTTP перенаправляется, OHIF на :3000 по HTTPS
        run: |
          make tls-cert HOST=127.0.0.1
          $GW --name web -p 8080:80 -p 8443:443 -p 3000:3000 medviz-web
          sleep 3
          docker logs web 2>&1 | grep -q "шлюз работает по HTTPS"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/studies/x)" = 301
          curl -sf --cacert infra/tls/ca.crt https://127.0.0.1:8443/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = 301
          ! curl -sf https://127.0.0.1:8443/ >/dev/null 2>&1   # без доверия к CA клиники — отказ
      - name: Сервисы backend импортируются в образе
        run: docker run --rm -e PYTHONPATH=/app medviz-backend python -c "import app.main, app.workers.orthanc_watcher, app.workers.classification_tasks; print('ok')"
