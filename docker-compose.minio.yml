# Для клиник со своим образом MinIO (зеркало или собственная сборка):
#   MINIO_IMAGE=<реестр>/minio:<версия> docker compose -f docker-compose.yml -f docker-compose.minio.yml up -d
services:
  minio:
    image: ${MINIO_IMAGE:?укажите MINIO_IMAGE — образ minio/minio на Docker Hub больше не публикуется}
    entrypoint: ["minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: !override
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
    ports: !override
      - "9000:9000"
      - "9001:9001"
