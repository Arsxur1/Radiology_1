# Единая конфигурация установки (ТЗ, раздел 7: один сервер, одна команда).
# Пиксельные данные — в Orthanc/MinIO; метаданные — в PostgreSQL.
# Идентифицирующий контур (idmap) изолирован от доверенного контура.

x-backend-env: &backend-env
  env_file: .env

services:
  # ─── Метаданные (доверенный контур) ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  # ─── Идентифицирующий контур: таблица ID↔UUID (SR-9), отдельная БД ─────────
  postgres-idmap:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${IDMAP_POSTGRES_DB}
      POSTGRES_USER: ${IDMAP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${IDMAP_POSTGRES_PASSWORD}
    volumes:
      - pg_idmap_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IDMAP_POSTGRES_USER} -d ${IDMAP_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Объектное хранилище ──────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "9000:9000"
      - "9001:9001"

  # ─── DICOM-узлы ───────────────────────────────────────────────────────────
  orthanc-raw:
    image: orthancteam/orthanc:latest
    restart: unless-stopped
    volumes:
      - ./infra/orthanc/orthanc-raw.json:/etc/orthanc/orthanc.json:ro
      - orthanc_raw_data:/var/lib/orthanc/db
    ports:
      - "4242:4242"   # DICOM C-STORE (приём от модальностей)
      - "8042:8042"   # REST / DICOMweb

  orthanc-clean:
    image: orthancteam/orthanc:latest
    restart: unless-stopped
    volumes:
      - ./infra/orthanc/orthanc-clean.json:/etc/orthanc/orthanc.json:ro
      - orthanc_clean_data:/var/lib/orthanc/db
    ports:
      - "8043:8042"   # DICOMweb для OHIF (обезличенные данные)

  # ─── Очередь ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # ─── Аутентификация ───────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./infra/keycloak/realm-medviz.json:/opt/keycloak/data/import/realm-medviz.json:ro
    ports:
      - "8080:8080"

  # ─── Backend API ──────────────────────────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ingest_data:/data/ingest
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  # ─── Воркеры приёма/обезличивания ─────────────────────────────────────────
  worker:
    build: ./backend
    restart: unless-stopped
    <<: *backend-env
    depends_on:
      - backend
      - redis
    volumes:
      - ingest_data:/data/ingest
    command: celery -A app.workers.celery_app worker --loglevel=INFO

  # ─── Наблюдатель за сетевой папкой (FR-1, резервный путь приёма) ───────────
  folder-watcher:
    build: ./backend
    restart: unless-stopped
    <<: *backend-env
    depends_on:
      - backend
    volumes:
      - ingest_data:/data/ingest
    command: python -m app.workers.folder_watcher

  # ─── Просмотрщик ──────────────────────────────────────────────────────────
  ohif:
    image: ohif/app:latest
    restart: unless-stopped
    volumes:
      - ./frontend/config/ohif.js:/usr/share/nginx/html/app-config.js:ro
    ports:
      - "3000:80"
    depends_on:
      - orthanc-clean

volumes:
  pg_data:
  pg_idmap_data:
  minio_data:
  orthanc_raw_data:
  orthanc_clean_data:
  redis_data:
  ingest_data:
