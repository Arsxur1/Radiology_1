# Единая конфигурация установки (ТЗ, раздел 7: один сервер, одна команда).
# Пиксельные данные — в Orthanc/MinIO; метаданные — в PostgreSQL.
# Идентифицирующий контур (idmap) изолирован от доверенного контура.

x-backend-env: &backend-env
  env_file: .env

services:
  # ─── Метаданные (доверенный контур) ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  # ─── Идентифицирующий контур: таблица ID↔UUID (SR-9), отдельная БД ─────────
  postgres-idmap:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${IDMAP_POSTGRES_DB}
      POSTGRES_USER: ${IDMAP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${IDMAP_POSTGRES_PASSWORD}
    volumes:
      - pg_idmap_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IDMAP_POSTGRES_USER} -d ${IDMAP_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Учётные записи сотрудников (Keycloak). Отдельная БД: не пропадают при пересоздании
  # контейнера Keycloak и попадают в ночной бэкап (хеши паролей — зашифрованно).
  postgres-keycloak:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - pg_keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Объектное хранилище ──────────────────────────────────────────────────
  minio:
    # S3-совместимое хранилище (имя сервиса историческое). По умолчанию — SeaweedFS:
    # образ minio/minio больше не публикуется на Docker Hub. Свой MinIO — см.
    # docker-compose.minio.yml. Ключи доступа — MINIO_ROOT_USER / MINIO_ROOT_PASSWORD.
    image: ${S3_IMAGE:-chrislusf/seaweedfs:4.48}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/medviz/seaweedfs-start.sh"]
    environment:
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
      - ./infra/s3/seaweedfs-start.sh:/etc/medviz/seaweedfs-start.sh:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
    ports:
      - "9000:9000"

  # ─── DICOM-узлы ───────────────────────────────────────────────────────────
  orthanc-raw:
    image: orthancteam/orthanc:latest
    restart: unless-stopped
    volumes:
      - ./infra/orthanc/orthanc-raw.json:/etc/orthanc/orthanc.json:ro
      - orthanc_raw_data:/var/lib/orthanc/db
    ports:
      - "4242:4242"   # DICOM C-STORE (приём от модальностей)
      - "8042:8042"   # REST / DICOMweb

  orthanc-clean:
    image: orthancteam/orthanc:latest
    restart: unless-stopped
    volumes:
      - ./infra/orthanc/orthanc-clean.json:/etc/orthanc/orthanc.json:ro
      - orthanc_clean_data:/var/lib/orthanc/db
    ports:
      - "8043:8042"   # DICOMweb для OHIF (обезличенные данные)

  # ─── Очередь ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # ─── Аутентификация ───────────────────────────────────────────────────────
  keycloak:
    # Версия закреплена (проверена на стенде). Боевой режим: учётные записи в PostgreSQL,
    # а не во встроенной H2 внутри контейнера (start-dev терял бы всех при пересоздании).
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.0.7}
    restart: unless-stopped
    command: start --import-realm
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # HTTP внутри сети клиники; HTTPS снаружи — на шлюзе (заголовки X-Forwarded-*).
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # Keycloak доступен только через шлюз по пути /auth (порт 8080 наружу не открыт).
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HEALTH_ENABLED: "true"
      # Внешний адрес (для браузеров врачей) — он же издатель токенов; backend ходит за
      # ключами по внутреннему адресу (backchannel).
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost/auth}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./infra/keycloak/realm-medviz.json:/opt/keycloak/data/import/realm-medviz.json:ro

  # ─── Backend API ──────────────────────────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ingest_data:/data/ingest
      - ./models:/data/models:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  # ─── Воркеры приёма/обезличивания ─────────────────────────────────────────
  worker:
    build:
      context: ./backend
      args:
        # Для реальной модели: WORKER_EXTRAS=[infer] в .env и `docker compose build worker`.
        EXTRAS: ${WORKER_EXTRAS:-}
    restart: unless-stopped
    <<: *backend-env
    depends_on:
      - backend
      - redis
    volumes:
      - ingest_data:/data/ingest
      # Веса моделей: <weights_hash>.pt, только чтение (хеш сверяется при загрузке).
      - ./models:/data/models:ro
      # Веса TotalSegmentator (скачиваются make totalseg-candidate, отпечаток сверяется).
      - totalseg_weights:/root/.totalsegmentator
    command: celery -A app.workers.celery_app worker --loglevel=INFO

  # ─── Наблюдатель за сетевой папкой (FR-1, резервный путь приёма) ───────────
  folder-watcher:
    build: ./backend
    restart: unless-stopped
    <<: *backend-env
    depends_on:
      - backend
    volumes:
      - ingest_data:/data/ingest
    command: python -m app.workers.folder_watcher

  # ─── Наблюдатель orthanc-raw: снимки от PACS → очередь обезличивания (FR-1) ──
  orthanc-watcher:
    build: ./backend
    restart: unless-stopped
    <<: *backend-env
    depends_on:
      - orthanc-raw
      - redis
      - worker
    command: python -m app.workers.orthanc_watcher

  # ─── Шлюз: рабочее место врача + API + DICOMweb на одном адресе (:80) ──────
  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      ORTHANC_USERNAME: ${ORTHANC_USERNAME}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD}
    # Единственная точка входа: интерфейс, API, вход (/auth), DICOMweb, OHIF (:3000).
    # HTTPS — если в infra/tls/ лежат server.crt и server.key (make tls-cert).
    volumes:
      - ./infra/nginx/locations.conf.template:/etc/nginx/medviz/locations.conf.template:ro
      - ./infra/nginx/15-orthanc-auth.envsh:/docker-entrypoint.d/15-orthanc-auth.envsh:ro
      - ./infra/nginx/16-medviz-conf.sh:/docker-entrypoint.d/16-medviz-conf.sh:ro
      - ./infra/tls:/etc/nginx/tls:ro
    ports:
      - "80:80"
      - "443:443"
      - "3000:3000"
    depends_on:
      - backend
      - orthanc-clean
      - keycloak
      - ohif

  # ─── Просмотрщик ──────────────────────────────────────────────────────────
  ohif:
    image: ohif/app:latest
    restart: unless-stopped
    # entrypoint образа пересжимает и перезаписывает app-config.js — с файлом,
    # смонтированным только на чтение, это даёт ошибки записи. Поэтому наш файл
    # монтируется отдельно и копируется перед штатным entrypoint.
    entrypoint:
      - /bin/sh
      - -c
      - cp /medviz/ohif.js /usr/share/nginx/html/app-config.js && exec /usr/src/entrypoint.sh nginx -g 'daemon off;'
    volumes:
      - ./frontend/config/ohif.js:/medviz/ohif.js:ro
    # Наружу — только через шлюз (:3000, с сертификатом — HTTPS).
    depends_on:
      - orthanc-clean

volumes:
  totalseg_weights:
  pg_data:
  pg_idmap_data:
  pg_keycloak_data:
  minio_data:
  orthanc_raw_data:
  orthanc_clean_data:
  redis_data:
  ingest_data:
