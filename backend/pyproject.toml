[project]
name = "medviz-backend"
version = "0.1.0"
description = "Платформа анализа медицинских изображений — backend (этап 1, RESEARCH)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "celery>=5.3",
    "redis>=5.0",
    "pydicom>=2.4",
    "minio>=7.2",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    # Геометрия 3D-моделей (FR-5) проверяется в тестах.
    "numpy>=1.26",
    "scikit-image>=0.22",
    "nibabel>=5.0",
    # Совмещение модальностей (FR-4) на фантоме.
    "SimpleITK>=2.3",
    "pillow>=10.0",
]
# Коннектор к внешнему PACS по классическому DICOM-сетевому протоколу (FR-1).
pacs = [
    "pynetdicom>=2.0",
]
# Инференс классификатора находок на продуктивном сервере (воркер). CPU достаточно:
# один рентген ОГК — доли секунды–секунды на DenseNet-121.
infer = [
    "torch>=2.2",
    "torchvision>=0.17",
    "pillow>=10.0",
    "numpy>=1.26",
    # Открытые предобученные модели для теневой оценки на площадке (Apache-2.0).
    "torchxrayvision>=1.2",
    # Сегментация органов КТ (задача total, Apache-2.0); на CPU — быстрый режим 3 мм.
    "TotalSegmentator>=2.4",
    # DICOM SEG — контуры структур для просмотрщика OHIF.
    "highdicom>=0.22",
    # 3D-модели по подтверждённым маскам (FR-5): marching cubes, чтение NIfTI.
    "scikit-image>=0.22",
    "nibabel>=5.0",
    # Совмещение модальностей (FR-4): жёсткая → аффинная → B-сплайн, Mattes MI.
    "SimpleITK>=2.3",
]
# Офлайн-контур дообучения (FR-10 п. 3) — ставится ТОЛЬКО на обучающем сервере.
train = [
    "torch>=2.2",
    "torchvision>=0.17",
    "pillow>=10.0",
    "numpy>=1.26",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: вызов в аргументе по умолчанию — штатный паттерн FastAPI (Depends()).
# UP042: str+Enum намеренно (совместимость с SQLAlchemy SAEnum и сериализацией .value).
ignore = ["B008", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
